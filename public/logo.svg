<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80" fill="none">
  <defs>
    <linearGradient id="dk_accent_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B4FFF"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="dk_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="dk_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Brand Mark Icon Box (Sharp 2px radius) -->
  <g transform="translate(10, 10)">
    <rect width="60" height="60" rx="3" fill="#090909"/>
    <rect x="0.75" y="0.75" width="58.5" height="58.5" rx="2.25" stroke="url(#dk_accent_grad)" stroke-width="1.5" stroke-opacity="0.8"/>
    
    <!-- Stylized Sharp DK Vector Mark -->
    <!-- Letter D -->
    <path d="M16 44V16H27C34 16 38 20 38 30C38 40 34 44 27 44H16ZM22.5 38.5H26.5C30.5 38.5 32.5 35.5 32.5 30C32.5 24.5 30.5 21.5 26.5 21.5H22.5V38.5Z" fill="#ffffff"/>
    
    <!-- Letter K / Innovation Spark Angular Geometry -->
    <path d="M37 44L44.5 32.5L37.5 21H43.5L47.5 27.5L51.5 21H57.5L50.5 32.5L58 44H51.5L47.5 37L43.2 44H37Z" fill="url(#dk_accent_grad)"/>
    
    <!-- Innovation / Biology Synthesis Nodes -->
    <circle cx="48" cy="18" r="2.5" fill="#f59e0b" filter="url(#dk_glow)"/>
    <circle cx="14" cy="42" r="2" fill="#10b981"/>
  </g>

  <!-- Typographic Wordmark -->
  <g transform="translate(86, 25)">
    <!-- Main Name -->
    <text x="0" y="20" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#0a0a0a" letter-spacing="-0.5">
      DIVYANSH <tspan fill="#2B4FFF">KATIYAR</tspan>
    </text>
    
    <!-- Subtitle / Focus -->
    <text x="1" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="2.6">
      PCB STREAM • INNOVATION &amp; SCIENCE
    </text>
  </g>
</svg>
